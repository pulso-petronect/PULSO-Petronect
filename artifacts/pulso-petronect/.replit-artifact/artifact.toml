kind = "web"
previewPath = "/"
title = "PULSO Petronect"
description = "Plataforma demonstrativa de inteligência comportamental que transforma registros de navegação em indicadores, segmentos, oportunidades e recomendações de ação para o ecossistema Petronect."
version = "1.0.0"
id = "artifacts/pulso-petronect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18982

[services.development]
run = "pnpm --filter @workspace/pulso-petronect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulso-petronect", "run", "build" ]
serve = "static"
publicDir = "artifacts/pulso-petronect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18982"
BASE_PATH = "/"
